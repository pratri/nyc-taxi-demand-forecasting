version: 2

models:
  - name: int_trips_valid
    description: "Valid revenue trips only: positive duration and positive driver earnings. Drops zero-duration non-trips and negative-fare refunds."
    columns:
      - name: driver_earnings
        description: "fare_amount + tip_amount + extra. Excludes taxes, tolls, and government surcharges the driver does not keep. Note: credit-card tips only; cash tips unobserved."
        tests:
          - not_null
      - name: trip_duration_min
        description: "Minutes between pickup and dropoff."
        tests:
          - not_null

  - name: int_trips_weather
    description: "Valid trips left-joined to Central Park daily weather on pickup date."