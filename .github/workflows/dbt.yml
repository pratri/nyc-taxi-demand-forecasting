name: dbt build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Load sample data into DuckDB
        run: python scripts/load_sample.py

      - name: Install dbt packages
        run: dbt deps

      - name: Build and test all models on the sample
        run: dbt build --target sample
