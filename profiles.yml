nyc_taxi:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: taxi.duckdb
      threads: 4
    sample:
      type: duckdb
      path: sample.duckdb
      threads: 4
    bigquery:
      type: bigquery
      method: service-account
      project: nyc-taxi-501018
      dataset: nyc_taxi
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      threads: 4
      maximum_bytes_billed: 1000000000000