version: 2

models:
  - name: mart_earnings_by_zone_hour
    description: "Driver earnings per hour by pickup zone, hour of day, and day of week."
    columns:
      - name: pickup_location_id
        description: "TLC pickup zone. Every value must resolve to a zone in the lookup."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_zones')
                field: zone_id
      - name: trip_count
        tests:
          - not_null
      - name: earnings_per_hour
        tests:
          - not_null

  - name: mart_earnings_by_weather
    description: "Driver earnings aggregated by the day's weather condition."
    columns:
      - name: weather_condition
        description: "Bucketed from precipitation and snowfall."
        tests:
          - not_null
          - accepted_values:
              values: ['dry', 'light rain', 'rain', 'snow']

  - name: mart_daily_earnings
    description: "One row per day: earnings, weather, and calendar features. Modeling table for the weather regression."
    columns:
      - name: trip_date
        description: "Calendar date; one row per day."
        tests:
          - not_null
          - unique
      - name: is_weekend
        tests:
          - accepted_values:
              values: [0, 1]
